<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    
    h1 {
      font-size: 18px;
      margin-top: 0;
      color: #ed5f74;
    }
    
    textarea {
      width: 100%;
      height: 150px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      resize: vertical;
    }
    
    button {
      background-color: #ed5f74;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      margin-bottom: 10px;
    }
    
    button:hover {
      background-color: #e04a5f;
    }
    
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    
    .result {
      margin-top: 15px;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 4px;
      display: none;
    }
    
    .loading {
      text-align: center;
      display: none;
    }
    
    .spinner {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #ed5f74;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>小红爪子 - 小红书数据统计工具</h1>
  <textarea id="urls" placeholder="请在此处粘贴小红书链接，每行一个&#10;例如：&#10;https://www.xiaohongshu.com/discovery/item/xxx&#10;https://www.xiaohongshu.com/discovery/item/yyy"></textarea>
  <button id="analyze">开始分析</button>
  <button id="export" disabled>导出Excel</button>
  
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>正在分析中，请稍候...</p>
  </div>
  
  <div class="result" id="result">
    <p>分析完成！共获取到 <span id="count">0</span> 条数据</p>
  </div>
  
  <script src="libs/xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
